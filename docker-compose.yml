# Emergency Coordination System — single-host deployment.
#
#   docker compose --env-file deploy/.env up -d --build
#
# All persistent state lives in the project's Supabase instance: rows in its
# Postgres database, chat attachments in its Storage bucket. Neither container
# keeps anything of its own, so both can be rebuilt or replaced at any time.
#
# Start here: cp deploy/.env.example deploy/.env, then fill it in.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecs-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

      # ── Supabase: the only place anything is saved ──────────────────────────
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Supabase connection string}
      DB_RUN_MIGRATIONS: ${DB_RUN_MIGRATIONS:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-chat-attachments}

      # ── Access ─────────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random value}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to your dashboard origin(s)}
      RATE_LIMIT_TRUST_PROXY: "true"

      # ── Feature configuration ──────────────────────────────────────────────
      PUBLIC_TRACKING_BASE_URL: ${PUBLIC_TRACKING_BASE_URL:?set PUBLIC_TRACKING_BASE_URL}
      TRACKING_LINK_TTL_HOURS: ${TRACKING_LINK_TTL_HOURS:-24}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE:-+91}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

      # Demo hospitals and ambulances. On for a test deployment that needs
      # something to dispatch; turn it off before real use.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      # Root context so the build can reach web/ and deploy/nginx.conf.
      context: .
      dockerfile: web/Dockerfile
      args:
        # Same-origin: the browser talks only to this host, and nginx forwards
        # /api and /socket.io to the backend.
        VITE_API_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}/api
        VITE_SOCKET_URL: ${PUBLIC_BASE_URL}
        VITE_LOGIN_URL: ${PUBLIC_BASE_URL}
        VITE_HOSPITAL_APP_URL: ${PUBLIC_BASE_URL}/hospital
        VITE_DRIVER_APP_URL: ${PUBLIC_BASE_URL}/driver
        VITE_ADMIN_APP_URL: ${PUBLIC_BASE_URL}/admin
    image: ecs-web:latest
    restart: unless-stopped
    environment:
      # Same-origin setup: nginx serves the dashboards and forwards /api and
      # /socket.io to the backend over the compose network.
      PORT: "80"
      BACKEND_ORIGIN: "http://backend:3000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
